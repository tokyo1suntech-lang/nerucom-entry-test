<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NERUcom Entry Test</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0b1f36}
    body{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(620px,100%);background:#fff;border-radius:24px;padding:42px 30px;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.28)}
    h1{margin:0 0 12px;color:#123a63;font-size:38px}
    .ok{margin:0 0 14px;color:#11804f;font-size:20px;font-weight:800}
    p{margin:8px 0;color:#31475d;font-size:17px;line-height:1.7}
    .small{margin-top:20px;font-size:13px;color:#6b7b8b}
  </style>
</head>
<body>
  <main class="card">
    <h1>NERUcom</h1>
    <p class="ok">GitHub Pages 表示テスト</p>
    <p>この画面が会社LANから警告なしで開けば、<br>NERUcomの新しい入口候補として使えます。</p>
    <p>Google Apps Script の青い帯や<br>Google Sites の余計なアイコンは表示されません。</p>
    <p class="small">NERUcom Entry Test</p>
  </main>
</body>
</html>
